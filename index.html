<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal: Multi-Location Weather Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .status-transition { transition: background-color 0.7s ease, color 0.7s ease; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
        .hidden { display: none; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
</head>
<body class="bg-[#0f1115] text-slate-200 min-h-screen selection:bg-emerald-500/30">

    <!-- --- Header --- -->
    <header class="sticky top-0 z-30 bg-[#15181e]/80 backdrop-blur-md border-b border-slate-800/50 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i data-lucide="activity" class="w-5 h-5 text-white"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight hidden sm:block uppercase">THE SIGNAL</h1>
            </div>

            <div class="relative flex-1 max-w-xs">
                <select id="locationSelector" class="w-full bg-[#1c2128] border border-slate-700 rounded-xl px-4 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500/50 cursor-pointer">
                    <!-- Options populated by JS -->
                </select>
                <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500 pointer-events-none"></i>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6 pb-24">
        <!-- --- Traffic Light Section --- -->
        <section id="statusCard" class="relative overflow-hidden rounded-3xl p-8 flex flex-col items-center justify-center text-center status-transition shadow-2xl min-h-[240px]">
            <div class="absolute inset-0 bg-black/10 backdrop-blur-[2px]"></div>
            
            <div class="relative z-10 space-y-4">
                <div id="statusBadge" class="inline-flex items-center gap-2 px-4 py-1.5 bg-white/20 backdrop-blur-md rounded-full text-white text-xs font-bold uppercase tracking-widest">
                    <i id="statusIcon" data-lucide="check-circle-2" class="w-4 h-4"></i>
                    <span id="statusText">GREEN STATUS</span>
                </div>
                <h2 id="locationNameDisplay" class="text-4xl sm:text-6xl font-black text-white tracking-tighter uppercase">
                    NORTH COMPLEX
                </h2>
            </div>

            <!-- Decorative Elements -->
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <div class="absolute top-4 left-4 w-32 h-32 border-2 border-white rounded-full"></div>
                <div class="absolute bottom-4 right-4 w-48 h-48 border-2 border-white rounded-full"></div>
            </div>
        </section>

        <!-- --- Action Bar --- -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <button id="playBriefingBtn" class="group relative flex items-center justify-center gap-3 bg-[#1c2128] hover:bg-[#252b35] border border-slate-700 p-6 rounded-2xl transition-all active:scale-95">
                <div id="briefingIconContainer" class="p-3 rounded-xl bg-slate-800 group-hover:scale-110 transition-transform">
                    <i data-lucide="volume-2" class="w-6 h-6 text-white"></i>
                </div>
                <div class="text-left">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Audio Briefing</p>
                    <p class="text-lg font-bold">Play Update</p>
                </div>
            </button>

            <div class="bg-[#1c2128] border border-slate-700 p-6 rounded-2xl flex flex-col justify-center">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i data-lucide="info" class="w-3 h-3"></i> Admin Note
                </p>
                <p id="adminNoteDisplay" class="text-slate-300 leading-relaxed italic">
                    "All clear. Standard operations in effect."
                </p>
            </div>
        </div>

        <!-- --- Status History --- -->
        <section class="space-y-4">
            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4"></i> Status History
            </h3>
            <div id="logContainer" class="bg-[#1c2128] border border-slate-700 rounded-2xl overflow-hidden divide-y divide-slate-800">
                <!-- Logs populated by JS -->
            </div>
        </section>
    </main>

    <!-- --- Admin Trigger --- -->
    <button id="adminTrigger" class="fixed bottom-6 right-6 w-12 h-12 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full flex items-center justify-center shadow-xl transition-all active:scale-90 z-40">
        <i data-lucide="shield" class="w-5 h-5 text-slate-400"></i>
    </button>

    <!-- --- Auth Modal --- -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 modal-backdrop" onclick="closeAuth()"></div>
        <div class="relative bg-[#1c2128] border border-slate-700 w-full max-w-sm rounded-3xl p-8 shadow-2xl">
            <div class="flex flex-col items-center text-center space-y-4">
                <div class="w-16 h-16 bg-slate-800 rounded-2xl flex items-center justify-center mb-2">
                    <i data-lucide="lock" class="w-8 h-8 text-emerald-500"></i>
                </div>
                <div>
                    <h3 class="text-xl font-bold">Admin Access</h3>
                    <p class="text-sm text-slate-500">Enter command center password</p>
                </div>
                <form id="authForm" class="w-full space-y-4">
                    <input type="password" id="passwordInput" placeholder="••••••••" class="w-full bg-[#0f1115] border border-slate-700 rounded-xl px-4 py-3 text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
                    <div class="flex gap-2">
                        <button type="button" onclick="closeAuth()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-3 rounded-xl font-bold transition-colors">Cancel</button>
                        <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold transition-colors shadow-lg shadow-emerald-500/20">Verify</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- --- Admin Panel --- -->
    <div id="adminPanel" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="absolute inset-0 modal-backdrop hidden sm:block" onclick="closeAdmin()"></div>
        <div class="relative bg-[#15181e] border-t sm:border border-slate-800 w-full max-w-2xl sm:rounded-3xl h-[90vh] sm:h-auto max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i data-lucide="settings" class="w-5 h-5 text-emerald-500"></i>
                    <h3 class="text-lg font-bold">Command Center</h3>
                </div>
                <button onclick="closeAdmin()" class="p-2 hover:bg-slate-800 rounded-full transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-8">
                <!-- Global Overrides -->
                <div class="space-y-4">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="globe" class="w-4 h-4"></i> Global Overrides
                    </h4>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="globalOverride('Green')" class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-500 py-4 rounded-2xl font-bold transition-all active:scale-95">All Green</button>
                        <button onclick="globalOverride('Red')" class="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-500 py-4 rounded-2xl font-bold transition-all active:scale-95">All Red</button>
                    </div>
                </div>

                <!-- Location Management -->
                <div class="space-y-4">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Location Management</h4>
                    <div id="adminLocationList" class="space-y-4">
                        <!-- Populated by JS -->
                    </div>

                    <!-- Add New -->
                    <div class="bg-[#1c2128]/50 border border-dashed border-slate-700 rounded-2xl p-6 space-y-4">
                        <h5 class="text-sm font-bold text-slate-400">Add New Complex</h5>
                        <div class="flex gap-2">
                            <input type="text" id="newLocationName" placeholder="Complex Name (e.g. West Wing)" class="flex-1 bg-[#0f1115] border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
                            <button onclick="addLocation()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 rounded-xl font-bold text-sm transition-all">Add</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6 border-t border-slate-800 bg-[#1c2128]/50">
                <button onclick="closeAdmin()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-4 rounded-2xl font-bold transition-all shadow-lg shadow-emerald-500/20">Save & Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- Constants & State ---
        const ADMIN_PASSWORD = 'SIGNAL_ADMIN';
        const DEFAULT_LOCATIONS = [
            { id: 'north-complex', name: 'North Complex', status: 'Green', adminNote: 'All clear. Standard operations in effect.' },
            { id: 'south-complex', name: 'South Complex', status: 'Yellow', adminNote: 'Light rain expected. Monitor drainage systems.' },
            { id: 'elite-showcase', name: 'Elite Showcase', status: 'Red', adminNote: 'Severe thunderstorm warning. Evacuate outdoor areas immediately.' }
        ];

        let locations = JSON.parse(localStorage.getItem('signal_locations')) || DEFAULT_LOCATIONS;
        let selectedLocationId = localStorage.getItem('signal_last_location') || locations[0].id;
        let logs = JSON.parse(localStorage.getItem('signal_logs')) || [];

        // --- Core Functions ---
        function saveState() {
            localStorage.setItem('signal_locations', JSON.stringify(locations));
            localStorage.setItem('signal_last_location', selectedLocationId);
            localStorage.setItem('signal_logs', JSON.stringify(logs));
        }

        function render() {
            const currentLocation = locations.find(l => l.id === selectedLocationId) || locations[0];
            
            // Update Header Selector
            const selector = document.getElementById('locationSelector');
            selector.innerHTML = locations.map(l => `<option value="${l.id}" ${l.id === selectedLocationId ? 'selected' : ''}>${l.name}</option>`).join('');

            // Update Status Card
            const card = document.getElementById('statusCard');
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            const name = document.getElementById('locationNameDisplay');
            const icon = document.getElementById('statusIcon');

            card.className = `relative overflow-hidden rounded-3xl p-8 flex flex-col items-center justify-center text-center status-transition shadow-2xl min-h-[240px] ${getStatusBg(currentLocation.status)}`;
            text.textContent = `${currentLocation.status.toUpperCase()} STATUS`;
            name.textContent = currentLocation.name;
            icon.setAttribute('data-lucide', getStatusIconName(currentLocation.status));
            
            // Update Action Bar
            document.getElementById('adminNoteDisplay').textContent = `"${currentLocation.adminNote}"`;

            // Update Logs
            const logContainer = document.getElementById('logContainer');
            const locationLogs = logs.filter(l => l.locationId === selectedLocationId).sort((a, b) => b.timestamp - a.timestamp).slice(0, 10);
            
            if (locationLogs.length > 0) {
                logContainer.innerHTML = locationLogs.map(log => `
                    <div class="p-4 flex items-center justify-between text-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full ${getStatusBg(log.newStatus)}"></div>
                            <span class="font-medium">Changed from <span class="text-slate-500">${log.oldStatus}</span> to <span class="font-bold">${log.newStatus}</span></span>
                        </div>
                        <span class="text-xs text-slate-500 font-mono">${new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                `).join('');
            } else {
                logContainer.innerHTML = `<div class="p-8 text-center text-slate-500 italic text-sm">No recent status changes for this location.</div>`;
            }

            // Update Admin Panel List
            const adminList = document.getElementById('adminLocationList');
            adminList.innerHTML = locations.map(loc => `
                <div class="bg-[#1c2128] border border-slate-700 rounded-2xl p-4 space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex-1">
                            <input type="text" value="${loc.name}" onchange="updateLocationName('${loc.id}', this.value)" class="bg-transparent border-b border-transparent hover:border-slate-700 focus:border-emerald-500 focus:outline-none font-bold text-lg w-full transition-colors">
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex bg-[#0f1115] rounded-lg p-1 gap-1">
                                ${['Green', 'Yellow', 'Red'].map(s => `
                                    <button onclick="updateLocationStatus('${loc.id}', '${s}')" class="px-3 py-1 rounded-md text-xs font-bold transition-all ${loc.status === s ? getStatusBg(s) + ' text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}">${s}</button>
                                `).join('')}
                            </div>
                            <button onclick="deleteLocation('${loc.id}')" class="p-2 hover:bg-rose-500/20 text-rose-500 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <textarea onchange="updateLocationNote('${loc.id}', this.value)" placeholder="Enter admin note..." class="w-full bg-[#0f1115] border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 min-h-[80px] resize-none">${loc.adminNote}</textarea>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function getStatusBg(status) {
            if (status === 'Green') return 'bg-emerald-500';
            if (status === 'Yellow') return 'bg-amber-500';
            if (status === 'Red') return 'bg-rose-500';
            return 'bg-slate-500';
        }

        function getStatusIconName(status) {
            if (status === 'Green') return 'check-circle-2';
            return 'alert-triangle';
        }

        // --- Event Handlers ---
        document.getElementById('locationSelector').addEventListener('change', (e) => {
            selectedLocationId = e.target.value;
            saveState();
            render();
        });

        document.getElementById('playBriefingBtn').addEventListener('click', () => {
            const currentLocation = locations.find(l => l.id === selectedLocationId);
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(`Weather briefing for ${currentLocation.name}. Status is ${currentLocation.status}. Note: ${currentLocation.adminNote}`);
                const iconContainer = document.getElementById('briefingIconContainer');
                utterance.onstart = () => iconContainer.classList.add('bg-emerald-500', 'animate-pulse');
                utterance.onend = () => iconContainer.classList.remove('bg-emerald-500', 'animate-pulse');
                window.speechSynthesis.speak(utterance);
            }
        });

        document.getElementById('adminTrigger').addEventListener('click', () => {
            document.getElementById('authModal').classList.remove('hidden');
        });

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('passwordInput').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
            } else {
                alert('Incorrect Password');
            }
        });

        function closeAuth() { document.getElementById('authModal').classList.add('hidden'); }
        function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); }

        function updateLocationStatus(id, newStatus) {
            const loc = locations.find(l => l.id === id);
            if (loc.status !== newStatus) {
                logs.unshift({ id: Math.random().toString(36).substr(2, 9), locationId: id, oldStatus: loc.status, newStatus, timestamp: Date.now() });
                loc.status = newStatus;
                saveState();
                render();
            }
        }

        function updateLocationName(id, newName) {
            const loc = locations.find(l => l.id === id);
            loc.name = newName;
            saveState();
            render();
        }

        function updateLocationNote(id, newNote) {
            const loc = locations.find(l => l.id === id);
            loc.adminNote = newNote;
            saveState();
            render();
        }

        function globalOverride(status) {
            locations.forEach(loc => {
                if (loc.status !== status) {
                    logs.unshift({ id: Math.random().toString(36).substr(2, 9), locationId: loc.id, oldStatus: loc.status, newStatus: status, timestamp: Date.now() });
                    loc.status = status;
                }
            });
            saveState();
            render();
        }

        function addLocation() {
            const name = document.getElementById('newLocationName').value.trim();
            if (!name) return;
            const newLoc = {
                id: Math.random().toString(36).substr(2, 9),
                name: name,
                status: 'Green',
                adminNote: 'New complex added.'
            };
            locations.push(newLoc);
            document.getElementById('newLocationName').value = '';
            saveState();
            render();
        }

        function deleteLocation(id) {
            if (locations.length <= 1) return alert("At least one location must remain.");
            if (confirm("Delete this complex?")) {
                locations = locations.filter(l => l.id !== id);
                if (selectedLocationId === id) selectedLocationId = locations[0].id;
                saveState();
                render();
            }
        }

        // Initial Render
        render();
    </script>
</body>
</html>
